# Hardened SSH configuration — loaded first via sshd_config's Include directive.
# Key-only auth. Passwords, keyboard-interactive, and root login are disabled
# unconditionally; the only login account is `dev`.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AllowUsers dev
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
PrintMotd yes
AcceptEnv LANG LC_*
